[package]
name = "frequency-adder-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
juniper = { version = "0.17.1", features = ["url", "uuid"] }
juniper_axum = "0.3.0"
tempdir = "0.3.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
